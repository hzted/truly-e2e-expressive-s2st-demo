# DirectS2ST En->De training configuration.
# data.* TSVs: see training/data.py and scripts/data/.
model:
  c0_auxiliary_loss_weight: 0.0
  c0_gold_anchor_mass: 0.75
  c0_gold_anchored_distill_temperature: 1.0
  c0_gold_anchored_distill_weight: 0.0
  c0_teacher_distill_temperature: 1.0
  c0_teacher_distill_weight: 0.0
  c0_teacher_hidden_dim: 1024
  c0_teacher_hidden_distill_weight: 0.0
  c0_teacher_hidden_loss_type: cosine
  c0_teacher_hidden_use_projection: true
  campplus_depth_conditioning_mode: prefix_token
  campplus_depth_identity_loss_weight: 0.1
  campplus_depth_start_level: 1
  campplus_embedding_size: 192
  campplus_film_scale: 1.0
  campplus_identity_level_aggregation: conditioned_mean
  campplus_identity_supervision: target
  codebook_loss_weights: null
  codebook_model_order: null
  codebook_size: 2048
  codec_mass_loss_weight: 0.0
  depth_auto_adjust_heads: true
  depth_chain_scheduled_sampling_mode: argmax
  depth_chain_scheduled_sampling_prob: 0.0
  depth_chain_scheduled_sampling_start_step: 0
  depth_chain_scheduled_sampling_temperature: 1.0
  depth_chain_scheduled_sampling_topk: 0
  depth_chain_scheduled_sampling_warmup_steps: 0
  depth_dropout: 0.1
  depth_ffn_dim: 4096
  depth_hidden_size: 1024
  depth_loss_weight: 1.0
  depth_num_heads: 16
  depth_num_layers: 8
  depth_objective_start_level: 1
  depth_scheduled_sampling_mode: argmax
  depth_scheduled_sampling_prob: 0.0
  depth_scheduled_sampling_start_step: 0
  depth_scheduled_sampling_temperature: 1.0
  depth_scheduled_sampling_topk: 0
  depth_scheduled_sampling_warmup_steps: 0
  depth_source_conditioning_detach: true
  depth_source_conditioning_dropout: 0.1
  depth_source_conditioning_num_heads: 16
  depth_source_conditioning_residual_scale: 0.2
  detach_temporal_for_depth_loss: false
  direct_text_to_c0_input: target
  direct_text_to_c0_kd_temperature: 1.0
  direct_text_to_c0_kd_weight: 0.0
  direct_text_to_c0_loss_weight: 0.0
  direct_text_to_c0_zero_speech_memory: false
  enable_c0_auxiliary_loss: false
  enable_c0_gold_anchored_distill: false
  enable_c0_teacher_distill: false
  enable_c0_teacher_hidden_distill: false
  enable_campplus_depth_conditioning: true
  enable_codec_mass_loss: false
  enable_depth_source_conditioning: false
  enable_direct_text_to_c0_auxiliary: false
  enable_mimi_nar_depth_prompt: true
  enable_mimi_source_acoustic_conditioning: false
  enable_mimi_source_acoustic_temporal_conditioning: false
  enable_mimi_source_speaker_prompt: true
  enable_mimi_source_style_token_bank: false
  enable_mixed_source_target_auxiliary: false
  enable_predicted_source_target_auxiliary: false
  enable_quality_cot: true
  enable_semantic_prefix_ar: false
  enable_source_unit_auxiliary: false
  enable_source_unit_transformer_auxiliary: false
  enable_target_only_speech_auxiliary: false
  enable_text_auxiliary: false
  enable_text_codec_ar: true
  enable_text_codec_kd_loss: false
  enable_text_codec_text_path_loss: true
  enable_text_prefix_ar: true
  enable_transvip_style_loss_aggregation: false
  enable_uniss_content_controls: true
  enable_unity_source_memory_fusion: false
  freeze_temporal_transformer: false
  freeze_whisper_encoder: true
  input_num_quantizers: 16
  level0_depth_objective: true
  level0_eos_loss_weight: 1.0
  level0_label_smoothing: 0.0
  level0_label_smoothing_train_only: false
  level0_loss_weight: 1.0
  level0_tail_loss_last_n: 0
  level0_tail_loss_weight: 1.0
  load_text_path_encoder: false
  mimi_nar_depth_attention_mode: full
  mimi_nar_depth_max_positions: 4096
  mimi_nar_depth_teacher_force_level_batch_size: 1
  mimi_source_acoustic_depth_start_level: 99
  mimi_source_acoustic_detach: true
  mimi_source_acoustic_input_sample_rate: 16000
  mimi_source_acoustic_model_name: kyutai/mimi
  mimi_source_acoustic_pooling: mean_std
  mimi_source_acoustic_residual_scale: 0.0
  mimi_source_acoustic_temporal_detach: true
  mimi_source_acoustic_temporal_residual_scale: 0.0
  mimi_source_speaker_prompt_detach: true
  mimi_source_style_token_c1_gate_init: 0.03
  mimi_source_style_token_count: 8
  mimi_source_style_token_depth_start_level: 1
  mimi_source_style_token_dropout: 0.1
  mimi_source_style_token_gate_init: 0.1
  mimi_source_style_token_num_heads: 8
  mimi_source_style_token_residual_scale: 0.7
  mixed_source_auxiliary_seed: 59
  mixed_source_prediction_prob: 0.0
  mixed_source_start_step: 0
  mixed_source_target_loss_weight: 0.0
  mixed_source_warmup_steps: 0
  num_codebook_levels: 16
  num_temporal_codebook_levels: 1
  predicted_source_target_batch_size: 2
  predicted_source_target_loss_weight: 0.0
  predicted_source_target_max_source_tokens: 64
  predicted_source_target_start_step: 0
  predicted_source_target_warmup_steps: 0
  quality_cot_code0_loss_weight: 1.0
  quality_cot_code1_loss_weight: 0.0
  quality_cot_depth_loss_weight: 3.0
  quality_cot_prompt_all_seps: false
  quality_cot_source_text_loss_weight: 0.4
  quality_cot_source_text_max_tokens: 128
  quality_cot_source_text_prefix_extra_token_ids_after_bos:
  - 4
  quality_cot_target_text_loss_weight: 0.6
  quality_cot_target_text_max_tokens: 128
  skip_mimi_source_acoustic_encoder_when_precomputed: false
  source_adapter_dropout: 0.1
  source_adapter_ffn_dim: 4096
  source_adapter_num_heads: 16
  source_adapter_num_layers: 0
  source_adapter_residual: true
  source_adapter_residual_scale: 0.1
  source_speaker_prompt_backend: mimi_mean_std
  source_speaker_prompt_dropout: 0.1
  source_speaker_prompt_ffn_dim: 4096
  source_speaker_prompt_num_heads: 16
  source_speaker_prompt_num_layers: 2
  source_speaker_prompt_speech_layer: 12
  source_unit_blank_id: 1000
  source_unit_loss_weight: 0.2
  source_unit_transformer_dropout: 0.1
  source_unit_transformer_ffn_dim: 4096
  source_unit_transformer_loss_weight: 0.5
  source_unit_transformer_max_positions: 513
  source_unit_transformer_num_heads: 8
  source_unit_transformer_num_layers: 2
  source_unit_vocab_size: 1000
  speech_encoder_name: facebook/w2v-bert-2.0
  speech_encoder_output_layer: 12
  speech_encoder_type: w2vbert2
  target_only_speech_code0_loss_weight: 0.0
  target_only_speech_text_loss_weight: 0.0
  teacher_force: true
  temporal_activation: gelu
  temporal_auto_adjust_heads: true
  temporal_context_levels: 1
  temporal_decoder_backend: direct
  temporal_dropout: 0.1
  temporal_ffn_dim: 4096
  temporal_hidden_size: 1024
  temporal_max_positions: 2048
  temporal_num_heads: 16
  temporal_num_layers: 12
  temporal_scheduled_sampling_decay_start_step: -1
  temporal_scheduled_sampling_decay_steps: 0
  temporal_scheduled_sampling_final_prob: 0.0
  temporal_scheduled_sampling_mode: argmax
  temporal_scheduled_sampling_preserve_last_n: 0
  temporal_scheduled_sampling_prob: 0.0
  temporal_scheduled_sampling_start_step: 0
  temporal_scheduled_sampling_temperature: 1.0
  temporal_scheduled_sampling_topk: 0
  temporal_scheduled_sampling_warmup_steps: 0
  text_bos_token_id: 8000
  text_codec_kd_loss_weight: 0.0
  text_codec_t2c_loss_weight: 0.5
  text_codec_t2t_loss_weight: 0.3
  text_codec_text_path_input: source
  text_label_smoothing: 0.0
  text_loss_weight: 1.0
  text_max_positions: 255
  text_pad_token_id: 0
  text_path_source_token_dropout: 0.0
  text_prefix_beam_size: 5
  text_prefix_extra_token_ids_after_bos:
  - 5
  text_prefix_length_penalty: 1.0
  text_prefix_min_tokens: 4
  text_prefix_no_repeat_ngram_size: 3
  text_prefix_sep_penalty: 0.0
  text_sep_token_id: 8001
  text_tokenizer_name: ../tokenizers/de_spm8k
  tie_text_embeddings: true
  train_only_depth_decoder: false
  transvip_load_source_encoder_from_checkpoint: false
  transvip_load_text_decoder_from_checkpoint: false
  transvip_model_name: ''
  transvip_num_new_tokens: null
  transvip_style_depth_loss_weight: 0.0
  transvip_style_kd_loss_weight: 0.0
  transvip_style_speech_loss_weight: 0.0
  transvip_style_text_loss_weight: 0.0
  transvip_text_decoder_text_vocab_size: null
  transvip_use_length_control: false
  unity_source_memory_detach: true
  unity_source_memory_fusion_mode: concat
  unity_source_memory_layer: 8
  unity_source_memory_scale: 0.5
  unity_source_memory_source: inner
  use_precomputed_source_acoustic_embeddings: true
  use_unified_code0_loss_in_objective: true
  vocab_size: 2050
data:
  train_tsv: data/de/train.tsv
  dev_tsv: data/de/dev.tsv
  target_text_column: translation
  source_text_column: sentence
  num_quantizers: 32
  speech_max_audio_seconds: 30.0
  text_max_tokens: 128
  source_text_max_tokens: 128
  eval_max_samples: 1000
  allow_online_campplus_fallback: true
  num_proc: 1
training:
  output_dir: outputs/de
  random_init_scheme: xavier_independent
  seed: 42
  learning_rate: 0.0001
  lr_scheduler_type: polynomial
  lr_scheduler_kwargs:
    lr_end: 5.0e-08
    power: 1.0
  warmup_steps: 3000
  weight_decay: 0.0
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  max_grad_norm: 0.5
  num_train_epochs: 40
  max_steps: -1
  bf16: true
  fsdp: auto_wrap
  fsdp_config:
    use_orig_params: true
  eval_strategy: steps
  eval_steps: 1500
  save_strategy: steps
  save_steps: 1500
  save_total_limit: 5
  logging_steps: 200
  dataloader_num_workers: 1
  report_to: none
